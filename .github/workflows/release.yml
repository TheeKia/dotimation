name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never interrupt a release between publishing core and its adapters.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release: true

  publish:
    name: Publish verified packages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: release-packages

      # Publish the exact archives tested by the consumer suite. Tarball
      # publishing skips rebuild hooks; retries can finish partial releases.
      - name: Publish core, then adapters
        run: |
          bun publish ./release-packages/core.tgz --access public --tolerate-republish
          bun publish ./release-packages/react.tgz --access public --tolerate-republish
          bun publish ./release-packages/svelte.tgz --access public --tolerate-republish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Generate GitHub release notes
        run: bunx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
