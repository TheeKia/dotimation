name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never interrupt a release between publishing core and its adapters.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release: true

  publish:
    name: Publish verified packages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # npm 11.19.0 bundled with this Node release supports Trusted Publishing.
      - name: Setup npm publisher
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: release-packages

      # npm exchanges the GitHub OIDC identity for short-lived credentials.
      # Publish the exact tested archives, skipping existing versions on retry.
      - name: Publish core, then adapters
        run: bun scripts/publish-packages.ts

      - name: Generate GitHub release notes
        run: bun scripts/github-release.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
