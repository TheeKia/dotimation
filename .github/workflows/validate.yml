name: Validate

on:
  workflow_call:
    inputs:
      release:
        description: Validate the release tag and retain tested package archives
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DOTIMATION_DIAGNOSTICS_DIR: ${{ github.workspace }}/test-results

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Validate release tag
        if: inputs.release
        run: bun scripts/check-release.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        if: runner.os == 'Linux'
        run: bun run lint

      - name: Build packages
        run: bun run build

      # Public API fixtures resolve the Svelte package's generated declarations.
      - name: Type check
        if: runner.os == 'Linux'
        run: bun run type-check

      - name: Validate distribution
        run: bun run check:dist

      - name: Run unit tests
        run: bun run test

      - name: Build playgrounds
        if: runner.os == 'Linux'
        run: |
          bun run --cwd apps/playground-react build
          bun run --cwd apps/playground-svelte build

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium

      - name: Verify browser behavior and GPU parity
        if: runner.os == 'Linux'
        # Headless Chromium still needs a display for WebGPU compositing.
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Pack packages
        if: runner.os == 'Linux'
        run: bun run pack:packages

      - name: Verify packed consumers
        if: runner.os == 'Linux'
        run: bun run test:packages
        env:
          DOTIMATION_PACKAGE_DIR: release-packages

      - name: Retain verified release packages
        if: runner.os == 'Linux' && inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: release-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Retain browser failure diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
